<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>URNA360 · Painel encerrado</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
  :root { --fundo:#071226; --cartao:#102445; --linha:#22385F; --texto:#EEF2FA; --texto-2:#A9B6CF; --amarelo:#F6C445; --link:#9CC2FF; }
  @media (prefers-color-scheme: light) { :root { --fundo:#F3F5FA; --cartao:#FFFFFF; --linha:#D3DAE8; --texto:#0B1630; --texto-2:#4A5A78; --amarelo:#8A5D00; --link:#1F55C8; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--fundo); color: var(--texto); font: 1rem/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
  main { max-width: 520px; width: 100%; background: var(--cartao); border: 1px solid var(--linha); border-radius: 16px; padding: 28px 24px; display: grid; gap: 14px; text-align: center; }
  h1 { margin: 0; font-size: 1.8rem; letter-spacing: .02em; } h1 span { color: var(--amarelo); }
  p { margin: 0; color: var(--texto-2); } a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>URNA<span>360</span></h1>
  <p><strong style="color:var(--texto)">Painel encerrado.</strong> O acompanhamento da apuração do 2º turno de 25/10/2026 foi desativado.</p>
  <p>Resultados oficiais: <a href="https://resultados.tse.jus.br/oficial/app/index.html" rel="noopener">portal de resultados do TSE</a>.</p>
</main>
</body>
</html>
