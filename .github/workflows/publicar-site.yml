name: publicar-site
# Publica o painel no ramo "site" (servido pelo link do githack) sempre que o código do app muda na main.
# O push é feito pelo bot do GitHub Actions: assim o GitHub não mostra o aviso "Compare & pull request"
# (o ramo "site" é saída de build e NUNCA deve ser mesclado na main).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'index.html', 'public/**', 'scripts/loader.html', 'package.json', 'package-lock.json', 'vite.config.ts']
permissions:
  contents: write
concurrency: { group: publicar-site, cancel-in-progress: false }
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_TSE_BASE: https://resultados.tse.jus.br
      - name: Atualizar ramo site
        run: |
          git clone -q --branch site --single-branch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/site
          cd /tmp/site
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$GITHUB_WORKSPACE/dist/." .
          mv index.html app.html
          cp "$GITHUB_WORKSPACE/scripts/loader.html" index.html
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -qm "Site: build de ${GITHUB_SHA::7}"
          git push -q origin site
          echo "publicado $(git rev-parse --short HEAD)"
