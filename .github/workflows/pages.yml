name: pages
# Publica o build estático no GitHub Pages. Sem proxy: o navegador lê os arquivos
# direto do TSE (só funciona se o TSE permitir CORS — ver Action verificar-tse).
# Só manual: o GitHub Pages precisa ser ativado em Settings → Pages (Source: GitHub Actions).
# Enquanto não estiver ativado, a publicação usada é o ramo "site" (ver README).
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          VITE_TSE_BASE: https://resultados.tse.jus.br
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: d
        uses: actions/deploy-pages@v4
