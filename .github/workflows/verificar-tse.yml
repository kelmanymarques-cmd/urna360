name: verificar-tse
# Baixa arquivos REAIS do TSE, registra cabeçalhos (CORS, ETag) e roda os testes de validação com eles.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verificar-tse.yml', 'src/core/**', 'tests/unit/real.test.ts']
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Baixar arquivos oficiais (3 requisições)
        run: |
          mkdir -p tests/real-data
          B=https://resultados.tse.jus.br/oficial/ele2026/6258/dados
          for f in br/br-c0001-e006258-u.json br/br-e006258-ab.json pe/pe-c0001-e006258-u.json; do
            n=$(basename $f)
            echo "=== $f"
            curl -sS -m 30 -D tests/real-data/$n.headers -H 'Origin: https://kelmanymarques-cmd.github.io' -o tests/real-data/$n "$B/$f"
            cat tests/real-data/$n.headers
          done
          for o in https://rawcdn.githack.com https://raw.githack.com https://exemplo-qualquer.com; do
            echo "=== Origin $o" | tee -a tests/real-data/cors-origens.txt
            curl -sS -m 30 -o /dev/null -D - -H "Origin: $o" "$B/br/br-c0001-e006258-u.json" | grep -i access-control | tee -a tests/real-data/cors-origens.txt || echo "sem ACAO" | tee -a tests/real-data/cors-origens.txt
          done
          echo "=== Fotos (sqcand do arquivo oficial)" | tee tests/real-data/fotos.txt
          for sq in 280002551544 280002542548; do
            for u in "https://resultados.tse.jus.br/oficial/ele2026/6258/fotos/br/$sq.jpeg" "https://resultados.tse.jus.br/oficial/ele2026/fotos/br/$sq.jpeg"; do
              echo "$(curl -sS -m 20 -o /tmp/f.bin -w '%{http_code} %{content_type} %{size_download}' "$u") $u" | tee -a tests/real-data/fotos.txt
            done
          done
          echo "=== CORS (preflight-less GET):"
          grep -i 'access-control' tests/real-data/*.headers || echo "SEM cabeçalho Access-Control-Allow-Origin"
      - name: Testes com dados reais
        run: npx vitest run tests/unit/real.test.ts 2>&1 | tee tests/real-data/resultado-testes.txt
      - name: Publicar evidências no ramo verificacao
        run: |
          mkdir -p /tmp/ev && cp -r tests/real-data/. /tmp/ev/
          date -u +%FT%TZ > /tmp/ev/consultado-em-utc.txt
          git config user.name "urna360-bot"; git config user.email "urna360-bot@users.noreply.github.com"
          git checkout --orphan verificacao && git rm -rqf . && git clean -fdxq && cp -r /tmp/ev/. .
          git add -A && git commit -qm "Evidências da verificação com arquivos reais do TSE" && git push -f origin verificacao
      - uses: actions/upload-artifact@v4
        with: { name: tse-real, path: tests/real-data/ }
